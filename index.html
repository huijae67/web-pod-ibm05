<html>
  <head>
    <title>pod테스트</title>
  </head>

  <body>
    <h1>작업시작</h1>

    <h2>Pod 테스트</h2>

    <h3>Pod 생성</h3>
    <p>kubectl apply -f webserver.yaml</p>

    <h3>Pod 확인</h3>
    <p>kubectl get pod</p>

    <h3>Pod 삭제</h3>
    <p>kubectl delete -f webserver.yaml</p>

    <h3>삭제 확인</h3>
    <p>kubectl get pod</p>

  </body>
</html>
